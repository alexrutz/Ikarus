[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikarus"
version = "0.1.0"
description = "JSBSim-based instrument-only A320-family flight simulator"
requires-python = ">=3.10"
dependencies = [
    "jsbsim>=1.3.1,<2",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["ikarus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

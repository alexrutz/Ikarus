<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ikarus — A320 Flight Deck</title>
<link rel="stylesheet" href="/static/css/cockpit.css">
</head>
<body>
<header id="topbar">
  <span id="title">IKARUS A320</span>
  <span id="conn" class="warn">CONNECTING…</span>
  <span id="simstat"></span>
</header>

<!-- FCU: value windows with push (managed) / pull (selected) knobs -->
<div id="fcu-strip">
  <div class="fcu-cell" data-ch="spd">
    <label>SPD/MACH</label>
    <input id="fcu-spd" type="number" min="100" max="399" step="1" title="scroll to rotate">
    <div class="knob-row">
      <button class="knob" data-cmd="fcu.spd.push" title="push = managed">◉</button>
      <button class="knob" data-cmd="fcu.spd.pull" title="pull = selected">⭗</button>
    </div>
  </div>
  <div class="fcu-cell" data-ch="hdg">
    <label>HDG</label>
    <input id="fcu-hdg" type="number" min="0" max="359" step="1">
    <div class="knob-row">
      <button class="knob" data-cmd="fcu.hdg.push">◉</button>
      <button class="knob" data-cmd="fcu.hdg.pull">⭗</button>
    </div>
  </div>
  <button id="fcu-ap1" class="fcu-btn">AP1</button>
  <button id="fcu-athr" class="fcu-btn">A/THR</button>
  <button id="fcu-fd" class="fcu-btn">FD</button>
  <div class="fcu-cell" data-ch="alt">
    <label>ALT</label>
    <input id="fcu-alt" type="number" min="100" max="41000" step="100">
    <div class="knob-row">
      <button class="knob" data-cmd="fcu.alt.push">◉</button>
      <button class="knob" data-cmd="fcu.alt.pull">⭗</button>
    </div>
  </div>
  <div class="fcu-cell" data-ch="vs">
    <label>V/S</label>
    <input id="fcu-vs" type="number" min="-6000" max="6000" step="100" placeholder="-----">
    <div class="knob-row">
      <button class="knob" data-cmd="fcu.vs.push" title="push = level off">◉</button>
      <button class="knob" data-cmd="fcu.vs.pull" title="pull = V/S mode">⭗</button>
    </div>
  </div>
  <div class="fcu-cell">
    <label>THR LEVER</label>
    <div id="detent" class="detent">CLB</div>
  </div>
  <button id="pause-btn" class="fcu-btn">PAUSE</button>
</div>

<main id="panel">
  <canvas id="pfd"></canvas>
</main>

<footer id="helpbar">
  keys: ←→↑↓ stick · 1/2/3/4 thrust IDLE/CLB/FLX/TOGA · -/= manual thrust · F/V flaps · G gear · B spdbrk · SPACE ap off · P pause · [ ] time×
</footer>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
